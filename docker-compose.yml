# Production compose (DESIGN.md §11.2): pulls a published image, NFS-style bind mounts, a
# dedicated uid/gid, and the hardening from §11.1 — read-only rootfs, all capabilities
# dropped, no-new-privileges, a small /run tmpfs.
#
# `image:` names the tag the code-checkin-and-pr publishing matrix pushes
# (.github/workflows/publish.yml) — `:latest` on every push to `main` and on every
# published release, `:dev` on every push to `dev`. `:latest` is the right default for
# a compose file people copy: it always resolves to the newest published build rather
# than a specific version that may not exist yet. Once you are running this in earnest,
# prefer pinning — a released semver tag (`:0.0.1`) or, better, a digest
# (`ghcr.io/crzykidd/lftpweb@sha256:...`) — over a floating tag for production.

services:
  lftpweb:
    image: ghcr.io/crzykidd/lftpweb:latest
    container_name: lftpweb
    restart: unless-stopped
    # Docker's default is 10s, which is not enough to shut down cleanly while transfers are
    # running -- and shutting down cleanly is the whole point of `core/queue.py.stop()`, which
    # SIGTERMs each in-flight lftp child so its `-c` resume state is written out properly rather
    # than letting the container teardown SIGKILL them. That path terminates children with a 10s
    # grace each, plus the retention/metrics/backup/engine schedulers stopping first, so a busy
    # instance needs well over Docker's default to finish. Undersized, the container is killed
    # mid-shutdown and the graceful path never actually runs.
    #
    # Not a correctness requirement -- `pget -c`/`mirror -c` resume from whatever partial is on
    # disk however the process died (`core/queue.py._reconcile_orphaned_jobs` marks the orphaned
    # job INTERRUPTED at next startup and leaves the item eligible to be picked up again). This
    # buys a clean resume state rather than a recoverable one, which matters most on an image
    # pull while a large multi-file release is mid-transfer.
    stop_grace_period: 60s
    ports:
      # Not 8080: chosen to avoid collisions with other dev stacks on the shared build
      # host (see docs/decisions.md). Edit here if it collides on yours too.
      - "8087:8087"
    environment:
      # Dedicated NFS uid/gid — must match the export's expected identity. The
      # entrypoint (docker/entrypoint.sh) applies these and drops root via su-exec.
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      LFTPWEB_LOG_LEVEL: "INFO"
      # Empty by default: the version in the nav renders as plain text, not a dead link,
      # until this repo has a GitHub remote (DESIGN.md §9.1).
      LFTPWEB_REPO_URL: ""
    volumes:
      # NFS-backed bind mounts in production — paths are illustrative; point these at the
      # real exports. /staging is optional (DESIGN.md §6) and only needed if a queue uses
      # a staging-then-move workflow.
      - /srv/nfs/lftpweb/config:/config
      - /srv/nfs/downloads:/downloads
      - /srv/nfs/staging:/staging
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    # DESIGN.md §11.1 says "cap_drop: ALL — the app needs no capabilities at all", which
    # is true of the *running app* but not of the entrypoint's brief root phase: chown(2)
    # and setuid(2)/setgid(2) (dropping from root to PUID/PGID, §11.2) are themselves
    # capability-gated on modern kernels, even for uid 0 — cap_drop: ALL with nothing
    # added back makes the container crash-loop before the app ever starts. This is the
    # minimum added back to un-break that; see docs/decisions.md. The app process itself
    # ends up with none of these once su-exec drops privileges.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8087/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
