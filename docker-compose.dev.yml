# Development compose (DESIGN.md §11.2): builds locally, bind-mounts source for hot reload
# (uvicorn --reload + the Vite dev server), runs as the developer's own uid/gid (compose's
# native `user:`, the alternative to PUID/PGID mentioned in §11.2 — nothing here needs
# chowning, so the entrypoint's dance is skipped entirely), and uses scratch dirs under
# private_data/ instead of real NFS mounts.
#
# Run as: UID="$(id -u)" GID="$(id -g)" docker compose -f docker-compose.dev.yml up --build
# (falls back to 1000:1000 if UID/GID aren't set — the common single-user-box default).
# Backend: http://localhost:8087  (curl /api/health directly, no proxy)
# Frontend: http://localhost:5187 (Vite dev server, proxies /api to the backend service)
#
# Ports are 8087/5187, not 8080/5173: chosen to avoid collisions with other dev stacks on
# the shared build host (see docs/decisions.md). Edit here if they collide on yours too.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        # Must match `user:` below — the dev stage creates a passwd entry for this uid so
        # lftp's ssh doesn't fatal with "No user exists for uid N". See the comment there.
        DEV_UID: "${UID:-1000}"
        DEV_GID: "${GID:-1000}"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8087:8087"
    environment:
      LFTPWEB_LOG_LEVEL: "DEBUG"
      LFTPWEB_REPO_URL: ""
    # Per-job lftp rc files (credentials + the known_hosts pin, mode 0600) live here and are
    # unlinked when the job exits — DESIGN.md §4.2/§11.1 require a tmpfs so a password never
    # touches disk. The runtime image gets this from `docker/entrypoint.sh`, which creates and
    # chowns the directory while still root; the dev stage has no entrypoint and starts uvicorn
    # directly as the developer's uid, so bare root-owned /run is unwritable and every spawn
    # fails `SPAWN_FAILED: PermissionError: '/run/lftpweb'` while scanning and the whole UI
    # keep working. Mounting a uid-owned tmpfs at the same path fixes it without overriding
    # LFTPWEB_RUN_DIR to somewhere on the writable layer, which would put those credentials on
    # real disk in dev.
    tmpfs:
      - /run/lftpweb:uid=${UID:-1000},gid=${GID:-1000},mode=0700
    volumes:
      - ./backend:/app/backend
      - ./private_data/dev-config:/config
      - ./private_data/dev-downloads:/downloads
      - ./private_data/dev-staging:/staging

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend-dev
      args:
        # Must match `user:` below — see the comment on the frontend-dev stage.
        DEV_UID: "${UID:-1000}"
        DEV_GID: "${GID:-1000}"
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - backend
    ports:
      - "5187:5187"
    environment:
      LFTPWEB_DEV_API_PROXY: "http://backend:8087"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's container-side `npm ci` install instead of
      # letting the bind mount above shadow it with the host's (possibly absent, possibly
      # wrong-OS) node_modules.
      - /app/node_modules
