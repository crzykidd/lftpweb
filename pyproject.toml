[project]
name = "lftpweb"
description = "Containerized web interface for keeping a local directory in sync with a seedbox, using lftp as the transfer engine."
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Remote scanning + Test connection + (later) remote deletes over one pooled connection
    # (DESIGN.md §5). Key/agent/password auth, known_hosts policies.
    "asyncssh>=2.18",
    # Credential encryption at rest (DESIGN.md §8), moved up from phase 8 to phase 2 because
    # this is the phase where a seedbox password first exists — see docs/decisions.md.
    "cryptography>=43",
    # Password hashing for AUTH_MODE=password (DESIGN.md §8, phase 8) -- argon2id via the
    # PasswordHasher default. Anticipated back in §11.1's musllinux-wheel list.
    "argon2-cffi>=25.1.0",
    # Sonarr/Radarr integration (docs/arr-integration-spec.md, core/arrclient.py) -- promoted
    # from the dev-only group below, same version floor, now that core/arrclient.py's async
    # client is real runtime code, not just a test-time dependency of fastapi.testclient.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "backend/lftpweb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/lftpweb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
